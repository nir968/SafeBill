<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה - SafeBill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<!-- No Alpine.js here, same reasoning as login.html - one form, one
     error message, not worth a whole reactivity framework. -->
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center gap-3 mb-6">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 flex items-center justify-center">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SafeBill</h1>
        </div>

        <div class="glass-strong rounded-2xl shadow-2xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-slate-100 text-center">הרשמה</h2>

            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">אימייל</label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">סיסמה</label>
                    <input
                        id="password"
                        type="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                    <p class="text-xs text-slate-500 mt-1">לפחות 8 תווים</p>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">אימות סיסמה</label>
                    <input
                        id="password-confirm"
                        type="password"
                        required
                        autocomplete="new-password"
                        class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                </div>

                <p id="error-message" class="text-rose-300 text-sm hidden"></p>

                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white text-sm font-medium py-2.5 shadow-lg shadow-purple-500/30 disabled:opacity-50 transition"
                >
                    הרשמה
                </button>
            </form>

            <p class="text-center text-sm text-slate-400">
                כבר יש לך חשבון?
                <a href="/login" class="text-indigo-300 hover:text-indigo-200">התחברות</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const errorMessage = document.getElementById('error-message');
        const submitButton = document.getElementById('submit-button');

        function showError(text) {
            errorMessage.textContent = text;
            errorMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            // Client-side only - a quick typo check, not the real
            // validation. The server enforces the actual minimum length
            // regardless (see _MIN_PASSWORD_LENGTH in app/routers/auth.py)
            // and is the only check that matters for correctness here.
            if (password !== passwordConfirm) {
                showError('הסיסמאות אינן תואמות.');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'נרשם...';

            try {
                const response = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password,
                    }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => null);
                    showError((data && data.detail) || 'ההרשמה נכשלה.');
                    return;
                }

                // Signup doesn't log the new account in on its own (see
                // POST /auth/signup) - it only creates the row, so the
                // next step is a normal login with the same credentials.
                window.location.href = '/login';
            } catch (networkError) {
                showError('לא הצלחתי להתחבר לשרת.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'הרשמה';
            }
        });
    </script>
</body>
</html>
