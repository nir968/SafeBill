<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - SafeBill</title>

    <!-- Open Graph - controls the rich preview WhatsApp/Telegram/etc.
         show when this link is shared. og:image needs an absolute URL
         (a relative /static/... path won't resolve for an external
         scraper), so request.url_for is used rather than a hardcoded
         domain - this keeps working correctly if the domain ever
         changes, and still renders something valid in local dev. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SafeBill">
    <meta property="og:locale" content="he_IL">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="SafeBill - ניהול חשבונות חכם עם בינה מלאכותית">
    <meta property="og:description" content="העלו תמונה או PDF של חשבון ותנו לבינה המלאכותית לחלץ את הפרטים, לעקוב אחרי תשלומים ולהתריע על חריגות - הכל במקום אחד.">
    <meta property="og:image" content="{{ request.url_for('static', path='img/og-image.jpg') }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SafeBill - ניהול חשבונות חכם עם בינה מלאכותית">
    <meta name="twitter:description" content="העלו תמונה או PDF של חשבון ותנו לבינה המלאכותית לחלץ את הפרטים, לעקוב אחרי תשלומים ולהתריע על חריגות - הכל במקום אחד.">
    <meta name="twitter:image" content="{{ request.url_for('static', path='img/og-image.jpg') }}">

    <!-- iOS "Add to Home Screen" - apple-touch-icon controls the actual
         icon; apple-mobile-web-app-title sets a short label for under
         it (without this, iOS falls back to this page's own <title>,
         which would show the Hebrew page title instead of the app
         name). Plain favicon alongside for regular browser tabs. -->
    <link rel="apple-touch-icon" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-title" content="SafeBill">
    <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/favicon.png') }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<!-- No Alpine.js here on purpose - this page is one form with one error
     message to show/hide, nowhere near enough interactivity to justify
     loading a whole reactivity framework the way dashboard.html's much
     larger surface does. Plain vanilla JS below instead (shared bits with
     signup.html live in /static/js/auth.js). -->
<!-- select-none here, not chased down per-element - user-select is an
     inherited CSS property, and doesn't affect a native <input>'s own
     editable text regardless of what's set on an ancestor, so cascading
     it from <body> is both safe for the actual form fields and the only
     way to be sure no label/heading/container was missed (which is
     exactly how a real one - the "סיסמה" label - got through before).
     Explicitly opted back in below for the one thing worth letting
     someone select: the error message itself. -->
<body class="min-h-screen flex items-center justify-center px-4 select-none">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center gap-3 mb-6">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 flex items-center justify-center">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SafeBill</h1>
        </div>

        <div class="glass-strong rounded-2xl shadow-2xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-slate-100 text-center">התחברות</h2>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">אימייל</label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">סיסמה</label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 pe-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                        >
                        <button
                            type="button"
                            id="password-toggle"
                            aria-label="הצג סיסמה"
                            class="absolute inset-y-0 end-0 flex items-center px-3 text-slate-400 hover:text-slate-200"
                        ></button>
                    </div>
                </div>

                <p id="error-message" class="text-rose-300 text-sm hidden select-text"></p>

                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white text-sm font-medium py-2.5 shadow-lg shadow-purple-500/30 disabled:opacity-50 transition"
                >
                    התחברות
                </button>
            </form>

            <p class="text-center text-sm text-slate-400">
                אין לך חשבון?
                <a href="/signup" class="text-indigo-300 hover:text-indigo-200">הרשמה</a>
            </p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const submitButton = document.getElementById('submit-button');

        setupPasswordToggle('password', 'password-toggle');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'מתחבר...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => null);
                    errorMessage.textContent = extractErrorMessage(data, 'ההתחברות נכשלה.');
                    errorMessage.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'התחברות';
                    return;
                }

                // Full navigation, not a client-side route change - the
                // access_token cookie POST /auth/login just set needs to
                // actually be attached to the next request, and GET
                // /dashboard reads identity from that cookie now, not
                // from a user_id this page has no business constructing.
                window.location.href = '/dashboard';
            } catch (networkError) {
                errorMessage.textContent = 'לא הצלחתי להתחבר לשרת.';
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = 'התחברות';
            }
        });
    </script>
</body>
</html>
