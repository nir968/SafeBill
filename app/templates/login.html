<!DOCTYPE html>
<html dir="{{ dir }}" lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ t('login_page_title') }} - SafeBill</title>

    <!-- Open Graph - controls the rich preview WhatsApp/Telegram/etc.
         show when this link is shared. og:image needs an absolute URL
         (a relative /static/... path won't resolve for an external
         scraper), so request.url_for is used rather than a hardcoded
         domain - this keeps working correctly if the domain ever
         changes, and still renders something valid in local dev. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SafeBill">
    <meta property="og:locale" content="he_IL">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="SafeBill - ניהול חשבונות חכם עם בינה מלאכותית">
    <meta property="og:description" content="העלו תמונה או PDF של חשבון ותנו לבינה המלאכותית לחלץ את הפרטים, לעקוב אחרי תשלומים ולהתריע על חריגות - הכל במקום אחד.">
    <meta property="og:image" content="{{ request.url_for('static', path='img/og-image.jpg') }}?v={{ icon_version }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SafeBill - ניהול חשבונות חכם עם בינה מלאכותית">
    <meta name="twitter:description" content="העלו תמונה או PDF של חשבון ותנו לבינה המלאכותית לחלץ את הפרטים, לעקוב אחרי תשלומים ולהתריע על חריגות - הכל במקום אחד.">
    <meta name="twitter:image" content="{{ request.url_for('static', path='img/og-image.jpg') }}?v={{ icon_version }}">

    <!-- iOS "Add to Home Screen" - apple-touch-icon controls the actual
         icon (two link tags: an unsized one as a general fallback, plus
         an explicit 180x180 one for current devices - both point at the
         same file, harmless duplication). apple-mobile-web-app-title
         sets a short label for under the icon (without this, iOS falls
         back to this page's own <title>, which would show the Hebrew
         page title instead of the app name). apple-mobile-web-app-capable
         makes a home-screen launch open in standalone mode - no Safari
         address bar or back button, just this app's own in-page
         navigation - and status-bar-style=black-translucent overlays the
         iOS status bar on top of the page instead of reserving space for
         it; the safe-area-inset-top padding this needs to not visually
         collide with page content lives in dashboard.css (shared by
         every page), gated on viewport-fit=cover above actually being
         set - without that meta flag iOS reports the safe-area inset as
         zero and the padding would be a no-op. Plain favicon alongside
         for regular browser tabs. -->
    <link rel="apple-touch-icon" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}?v={{ icon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}?v={{ icon_version }}">
    <meta name="apple-mobile-web-app-title" content="SafeBill">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/favicon.png') }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <!-- Cross-fade between the landing and auth pages where the browser
         supports cross-document view transitions; elsewhere a normal load. -->
    <style>@view-transition { navigation: auto; }</style>
</head>
<!-- No Alpine.js here on purpose - this page is one form with one error
     message to show/hide, nowhere near enough interactivity to justify
     loading a whole reactivity framework the way dashboard.html's much
     larger surface does. Plain vanilla JS below instead (shared bits with
     signup.html live in /static/js/auth.js). -->
<!-- select-none here, not chased down per-element - user-select is an
     inherited CSS property, and doesn't affect a native <input>'s own
     editable text regardless of what's set on an ancestor, so cascading
     it from <body> is both safe for the actual form fields and the only
     way to be sure no label/heading/container was missed (which is
     exactly how a real one - the "סיסמה" label - got through before).
     Explicitly opted back in below for the one thing worth letting
     someone select: the error message itself. -->
<body class="min-h-screen flex items-center justify-center px-4 pb-12 pt-[calc(5rem_+_env(safe-area-inset-top,0px))] select-none">
    <!-- Soft brand-colored glow behind the logo - decorative only. -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden">
        <div class="absolute left-1/2 -top-40 h-[28rem] w-[28rem] -translate-x-1/2 rounded-full bg-purple-600/20 blur-3xl"></div>
    </div>

    {% include "_lang_switch.html" %}

    <main class="relative w-full max-w-md">
        <header class="flex flex-col items-center text-center mb-10 sm:mb-12">
            <!-- Brand lockup. dir="ltr" keeps the icon left of the Latin
                 wordmark - in this RTL page a plain flex row would put the
                 first item (the icon) on the right. -->
            <a href="/" dir="ltr" aria-label="{{ t('home_link') }}" class="flex items-center gap-3 sm:gap-4 mb-10 sm:mb-12 rounded-2xl">
                <div class="relative shrink-0" aria-hidden="true">
                    <div class="absolute -inset-3 rounded-3xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 opacity-40 blur-2xl"></div>
                    <div class="relative w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 ring-1 ring-inset ring-white/25 shadow-lg shadow-purple-500/30 flex items-center justify-center">
                        <svg class="w-6 h-6 sm:w-8 sm:h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    </div>
                </div>
                <span class="text-4xl sm:text-5xl font-medium tracking-tight leading-none pb-1 bg-gradient-to-r from-indigo-300 via-purple-400 to-pink-400 bg-clip-text text-transparent drop-shadow-[0_0_24px_rgba(168,85,247,0.35)]">SafeBill</span>
            </a>
            <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">{{ t('login_heading') }}</h1>
            <p class="mt-2 text-sm text-slate-400">{{ t('login_subtitle') }}</p>
        </header>

        <div class="rounded-3xl border border-white/[0.08] bg-white/[0.03] backdrop-blur-xl shadow-2xl shadow-black/40 p-6 sm:p-8">
            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">{{ t('email_label') }}</label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="name@example.com"
                        class="w-full rounded-xl bg-white/[0.04] border border-white/[0.08] px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 transition focus:outline-none focus:border-indigo-400/60 focus:bg-white/[0.06] focus:ring-4 focus:ring-indigo-500/15"
                    >
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">{{ t('password_label') }}</label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-xl bg-white/[0.04] border border-white/[0.08] px-4 py-3 pe-11 text-sm text-slate-100 placeholder:text-slate-500 transition focus:outline-none focus:border-indigo-400/60 focus:bg-white/[0.06] focus:ring-4 focus:ring-indigo-500/15"
                        >
                        <button
                            type="button"
                            id="password-toggle"
                            aria-label="{{ t('show_password') }}"
                            class="absolute inset-y-0 end-0 flex items-center px-3.5 text-slate-500 hover:text-slate-300 transition"
                        ></button>
                    </div>
                </div>

                <p id="error-message" class="rounded-xl border border-rose-500/20 bg-rose-500/10 px-3.5 py-2.5 text-sm text-rose-300 hidden select-text"></p>

                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 py-3 text-sm font-semibold text-white shadow-lg shadow-purple-500/25 transition hover:brightness-110 hover:shadow-purple-500/40 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:brightness-100"
                >
                    {{ t('login_submit') }}
                </button>

                <!-- Inside the form so it hides with it during the 2FA step. -->
                <p class="text-center">
                    <a href="/forgot-password" class="text-sm text-slate-400 hover:text-white transition">{{ t('forgot_link') }}</a>
                </p>
            </form>

            <!-- 2FA code step for Telegram-linked accounts - hidden until
                 POST /auth/login answers two_factor_required (see
                 startTwoFactorStep in /static/js/auth.js). -->
            <form id="twofa-form" class="space-y-5 hidden">
                <div class="flex flex-col items-center text-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-sky-500/10 border border-sky-400/20 text-sky-300 flex items-center justify-center" aria-hidden="true">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m22 2-7 20-4-9-9-4Z" />
                            <path d="M22 2 11 13" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-semibold text-white">{{ t('twofa_title') }}</h2>
                        <p class="mt-1 text-sm text-slate-400">{{ t('twofa_login_desc') }}</p>
                    </div>
                </div>
                <input
                    id="twofa-code"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    required
                    dir="ltr"
                    aria-label="{{ t('twofa_code_label') }}"
                    placeholder="••••••"
                    class="w-full rounded-xl bg-white/[0.04] border border-white/[0.08] px-4 py-3 text-center text-xl font-semibold tracking-[0.6em] text-slate-100 placeholder:text-slate-600 transition focus:outline-none focus:border-indigo-400/60 focus:bg-white/[0.06] focus:ring-4 focus:ring-indigo-500/15 select-text"
                >
                <p id="twofa-notice" class="text-emerald-300 text-xs text-center hidden"></p>
                <p id="twofa-error" class="rounded-xl border border-rose-500/20 bg-rose-500/10 px-3.5 py-2.5 text-sm text-rose-300 hidden select-text"></p>
                <button
                    type="submit"
                    id="twofa-submit"
                    class="w-full rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 py-3 text-sm font-semibold text-white shadow-lg shadow-purple-500/25 transition hover:brightness-110 hover:shadow-purple-500/40 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:brightness-100"
                >{{ t('twofa_verify') }}</button>
                <button type="button" id="twofa-resend" class="w-full text-sm text-slate-400 hover:text-white transition">{{ t('twofa_resend') }}</button>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-slate-400">
            {{ t('new_here') }}
            <a href="/signup" class="font-medium text-indigo-300 hover:text-indigo-200 transition">{{ t('create_account_link') }}</a>
        </p>
    </main>

    <script>window.SAFEBILL_I18N = {{ text|tojson }};</script>
    <script src="/static/js/lang.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const submitButton = document.getElementById('submit-button');

        setupPasswordToggle('password', 'password-toggle');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = T.login_submitting;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => null);
                    errorMessage.textContent = localizedError(response, data, T.login_failed, { 401: T.err_invalid_credentials });
                    errorMessage.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = T.login_submit;
                    return;
                }

                const data = await response.json().catch(() => null);
                if (data && data.two_factor_required) {
                    form.classList.add('hidden');
                    startTwoFactorStep({
                        purpose: 'login',
                        onVerified: () => { window.location.href = '/dashboard'; },
                    });
                    return;
                }

                // Full navigation, not a client-side route change - the
                // access_token cookie POST /auth/login just set needs to
                // actually be attached to the next request, and GET
                // /dashboard reads identity from that cookie now, not
                // from a user_id this page has no business constructing.
                window.location.href = '/dashboard';
            } catch (networkError) {
                errorMessage.textContent = T.network_error;
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = T.login_submit;
            }
        });
    </script>
</body>
</html>
