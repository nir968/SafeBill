<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>איפוס סיסמה - SafeBill</title>

    <!-- See login.html's own comment on this block for the full
         reasoning. -->
    <link rel="apple-touch-icon" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-title" content="SafeBill">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/favicon.png') }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<!-- No Alpine.js here, same reasoning as the other auth pages. The
     password checklist below deliberately mirrors signup.html's own
     (same five rules, same order, same _validate_password_strength this
     is all backstopping in app/routers/auth.py) - a new password set
     here is held to exactly the same bar as one set at signup. -->
<body class="min-h-screen flex items-center justify-center px-4 py-10 select-none">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center gap-3 mb-6">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 flex items-center justify-center">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SafeBill</h1>
        </div>

        <div class="glass-strong rounded-2xl shadow-2xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-slate-100 text-center">איפוס סיסמה</h2>

            <!-- Hidden entirely (not just disabled) when the link has no
                 token at all - a stray visit to /reset-password with no
                 query string, not the "token exists but is expired/wrong"
                 case, which the form itself is still shown for (that
                 error only comes back from the server on submit). -->
            <p id="no-token-message" class="text-rose-300 text-sm text-center hidden select-text">
                קישור לא תקין. בקשו קישור חדש לאיפוס סיסמה מ<a href="/forgot-password" class="underline">כאן</a>.
            </p>

            <form id="reset-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">סיסמה חדשה</label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 pe-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                        >
                        <button
                            type="button"
                            id="password-toggle"
                            aria-label="הצג סיסמה"
                            class="absolute inset-y-0 end-0 flex items-center px-3 text-slate-400 hover:text-slate-200"
                        ></button>
                    </div>
                    <ul id="password-requirements" class="mt-2 space-y-1 text-xs">
                        <li data-req="length" class="flex items-center gap-1.5 text-slate-500">
                            <span class="req-icon w-3 inline-block">○</span>לפחות 8 תווים
                        </li>
                        <li data-req="uppercase" class="flex items-center gap-1.5 text-slate-500">
                            <span class="req-icon w-3 inline-block">○</span>אות גדולה (A-Z)
                        </li>
                        <li data-req="lowercase" class="flex items-center gap-1.5 text-slate-500">
                            <span class="req-icon w-3 inline-block">○</span>אות קטנה (a-z)
                        </li>
                        <li data-req="number" class="flex items-center gap-1.5 text-slate-500">
                            <span class="req-icon w-3 inline-block">○</span>ספרה (0-9)
                        </li>
                        <li data-req="special" class="flex items-center gap-1.5 text-slate-500">
                            <span class="req-icon w-3 inline-block">○</span>תו מיוחד (!@#$% וכו')
                        </li>
                    </ul>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">אימות סיסמה</label>
                    <div class="relative">
                        <input
                            id="password-confirm"
                            type="password"
                            required
                            autocomplete="new-password"
                            class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 pe-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                        >
                        <button
                            type="button"
                            id="password-confirm-toggle"
                            aria-label="הצג סיסמה"
                            class="absolute inset-y-0 end-0 flex items-center px-3 text-slate-400 hover:text-slate-200"
                        ></button>
                    </div>
                </div>

                <p id="error-message" class="text-rose-300 text-sm hidden select-text"></p>
                <p id="success-message" class="text-emerald-300 text-sm hidden select-text"></p>

                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white text-sm font-medium py-2.5 shadow-lg shadow-purple-500/30 disabled:opacity-50 transition"
                >
                    איפוס סיסמה
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        const form = document.getElementById('reset-form');
        const noTokenMessage = document.getElementById('no-token-message');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const submitButton = document.getElementById('submit-button');
        const passwordInput = document.getElementById('password');

        setupPasswordToggle('password', 'password-toggle');
        setupPasswordToggle('password-confirm', 'password-confirm-toggle');

        // Read once at load - this page never navigates anywhere else on
        // its own, so the query string can't change out from under it.
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            noTokenMessage.classList.remove('hidden');
            form.classList.add('hidden');
        }

        function showError(text) {
            errorMessage.textContent = text;
            errorMessage.classList.remove('hidden');
        }

        // Mirrors _validate_password_strength in app/routers/auth.py
        // exactly, same as signup.html's own copy of this - see that
        // file's comment for why this can't drift out of sync with what
        // the server actually accepts.
        const passwordRequirements = {
            length: (v) => v.length >= 8,
            uppercase: (v) => /[A-Z]/.test(v),
            lowercase: (v) => /[a-z]/.test(v),
            number: (v) => /[0-9]/.test(v),
            special: (v) => /[^A-Za-z0-9]/.test(v),
        };

        function updatePasswordChecklist() {
            const value = passwordInput.value;
            let allMet = true;
            for (const [key, test] of Object.entries(passwordRequirements)) {
                const met = test(value);
                if (!met) allMet = false;
                const item = document.querySelector(`[data-req="${key}"]`);
                const icon = item.querySelector('.req-icon');
                item.classList.toggle('text-emerald-300', met);
                item.classList.toggle('text-slate-500', !met);
                icon.textContent = met ? '✓' : '○';
            }
            return allMet;
        }

        passwordInput.addEventListener('input', updatePasswordChecklist);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');

            const password = passwordInput.value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            if (!updatePasswordChecklist()) {
                showError('הסיסמה אינה עומדת בדרישות המפורטות למעלה.');
                return;
            }
            if (password !== passwordConfirm) {
                showError('הסיסמאות אינן תואמות.');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'מאפס...';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => null);
                    showError(extractErrorMessage(data, 'איפוס הסיסמה נכשל.'));
                    submitButton.disabled = false;
                    submitButton.textContent = 'איפוס סיסמה';
                    return;
                }

                // POST /auth/reset-password sets the session cookie
                // itself (same auto-login pattern as POST /auth/signup) -
                // no separate login step needed. Button stays disabled
                // through the redirect delay, same reasoning as
                // signup.html's own success path.
                submitButton.textContent = 'איפוס סיסמה';
                successMessage.textContent = 'הסיסמה אופסה בהצלחה! מעביר אותך ללוח הבקרה...';
                successMessage.classList.remove('hidden');
                window.setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1200);
            } catch (networkError) {
                showError('לא הצלחתי להתחבר לשרת.');
                submitButton.disabled = false;
                submitButton.textContent = 'איפוס סיסמה';
            }
        });
    </script>
</body>
</html>
