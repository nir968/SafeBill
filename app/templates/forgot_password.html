<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>שחזור סיסמה - SafeBill</title>

    <!-- See login.html's own comment on this block for the full
         reasoning. -->
    <link rel="apple-touch-icon" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}?v={{ icon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}?v={{ icon_version }}">
    <meta name="apple-mobile-web-app-title" content="SafeBill">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/favicon.png') }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<!-- No Alpine.js here, same reasoning as login.html/signup.html - one
     form with one message to show, nowhere near enough interactivity to
     justify loading a whole reactivity framework. Plain vanilla JS below
     (shared bits with every other auth page live in /static/js/auth.js). -->
<body class="min-h-screen flex items-center justify-center px-4 select-none">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center gap-3 mb-6">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 flex items-center justify-center">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SafeBill</h1>
        </div>

        <div class="glass-strong rounded-2xl shadow-2xl p-6 space-y-4">
            <div class="text-center space-y-1">
                <h2 class="text-lg font-semibold text-slate-100">שחזור סיסמה</h2>
                <p class="text-xs text-slate-400">הזינו את כתובת האימייל שלכם ונשלח אליכם קישור לאיפוס הסיסמה</p>
            </div>

            <form id="forgot-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">אימייל</label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="w-full rounded-lg bg-white/5 border border-white/10 text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                </div>

                <p id="error-message" class="text-rose-300 text-sm hidden select-text"></p>
                <!-- Always the same text regardless of whether the email
                     actually has an account - POST /auth/forgot-password
                     itself already returns this identical message either
                     way (see app/routers/auth.py), so this page just
                     displays whatever came back rather than branching on
                     it - nothing here could leak which emails are
                     registered even if someone tried to make it. -->
                <p id="success-message" class="text-emerald-300 text-sm hidden select-text"></p>

                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white text-sm font-medium py-2.5 shadow-lg shadow-purple-500/30 disabled:opacity-50 transition"
                >
                    שליחת קישור
                </button>
            </form>

            <p class="text-center text-sm text-slate-400">
                <a href="/login" class="text-indigo-300 hover:text-indigo-200">חזרה להתחברות</a>
            </p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        const form = document.getElementById('forgot-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const submitButton = document.getElementById('submit-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'שולח...';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value }),
                });

                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    // Only a genuine client error (e.g. malformed request)
                    // reaches this branch - "email not found" is never a
                    // distinct error from this endpoint by design.
                    errorMessage.textContent = extractErrorMessage(data, 'משהו השתבש, נסו שוב.');
                    errorMessage.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'שליחת קישור';
                    return;
                }

                // Left disabled deliberately (no re-enable here) - the
                // request already succeeded from the server's point of
                // view; a second click has nothing useful left to do,
                // same reasoning as signup.html's own success path.
                successMessage.textContent = (data && data.message) || 'אם קיים חשבון עם כתובת האימייל הזו, נשלח אליו קישור לאיפוס הסיסמה.';
                successMessage.classList.remove('hidden');
                submitButton.textContent = 'הקישור נשלח';
            } catch (networkError) {
                errorMessage.textContent = 'לא הצלחתי להתחבר לשרת.';
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = 'שליחת קישור';
            }
        });
    </script>
</body>
</html>
