[pytest]
# Lets async def test_* functions run directly, no @pytest.mark.asyncio
# needed on each one - every test in this suite is async because the code
# under test is (FastAPI dependencies, DB-touching helpers).
asyncio_mode = auto

# Without this, `import app...` in the test files only resolves when
# pytest happens to be invoked as `python -m pytest` (which prepends the
# CWD to sys.path itself) - plain `pytest` (what CI's workflow runs, and
# what most editors/IDEs run by default) does not, since tests/ has no
# __init__.py and pytest's default "prepend" import mode then only adds
# tests/ itself to sys.path, not the project root above it. `.` is
# resolved relative to rootdir (this file's own directory), so this
# fixes both invocations the same way rather than depending on which one
# happens to be used.
pythonpath = .
