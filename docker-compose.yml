services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safebill
      POSTGRES_PASSWORD: 0U1zs37
      POSTGRES_DB: safebill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safebill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Loads every var in .env as a real container environment variable -
    # this is what actually makes SECRET_KEY/INTERNAL_API_KEY (and
    # anything else with no default in app/config.py's Settings) visible
    # in here reliably. Previously this container only "happened" to see
    # .env at all because of the volumes mount below placing it at
    # /app/.env for pydantic-settings' own env_file lookup to find - a
    # real mechanism, but an implicit one that breaks the moment that
    # mount is ever removed/changed. Explicit env_file doesn't depend on
    # that. Entries in `environment:` below still win over .env for the
    # same key (Compose's own precedence rule), which is exactly why
    # DATABASE_URL/REDIS_URL can stay hardcoded to the in-Docker service
    # hostnames here even though .env's own versions of those point
    # elsewhere (e.g. at production's `db`/`redis` too, just not
    # reachable from a plain `docker compose up` on your machine).
    env_file:
      - .env
    environment:
      # ${POSTGRES_PASSWORD:-0U1zs37}, not a hardcoded literal repeated
      # in two places - this now always matches whatever password the
      # `db` service below was actually initialized with (its own
      # POSTGRES_PASSWORD), whether that's .env's value or the same
      # 0U1zs37 fallback. The previous literal "POSTGRES_PASSWORD" here
      # (not a real password, and not a valid ${...} reference either)
      # is exactly what asyncpg's "password authentication failed for
      # user safebill" crash was.
      DATABASE_URL: postgresql+asyncpg://safebill:${POSTGRES_PASSWORD:-0U1zs37}@db:5432/safebill
      REDIS_URL: redis://redis:6379/0
      VISION_PROVIDER: gemini
      # Set in a .env file next to this compose file, or export in the
      # shell before `docker compose up` — never hardcode a real key here.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VLM_TIMEOUT_SECONDS: 60
    ports:
      - "8000:8000"
    volumes:
      - ./:/app # to change code without rebuilding the image
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    # No `volumes:` mount on this service (unlike api above) - env_file
    # is the ONLY way this container ever sees .env at all, which is
    # exactly why it was crashing at startup with a pydantic
    # ValidationError on secret_key/internal_api_key: neither has a
    # default in app/config.py's Settings, and with no volume mount and
    # no env_file, there was nothing in this container's environment or
    # filesystem for pydantic-settings to find them in.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://safebill:${POSTGRES_PASSWORD:-0U1zs37}@db:5432/safebill
      REDIS_URL: redis://redis:6379/0
      VISION_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Only the worker (Enforcer + Analyst) sends Telegram alerts - the
      # api process never needs this. Set in a .env file next to this
      # compose file, or export in the shell before `docker compose up`.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
