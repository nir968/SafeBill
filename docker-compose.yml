services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safebill
      # No fallback value on purpose - ${POSTGRES_PASSWORD} alone (no `:-`
      # or `:?`) would silently resolve to an EMPTY STRING if .env is
      # missing or doesn't define it (Compose only warns, never fails),
      # which is exactly how a mismatched/empty password reaches asyncpg
      # instead of a clear error at `docker compose up` time. `:?` makes
      # that failure loud and immediate instead. .env is gitignored (as
      # it must be) and therefore never arrives via `git pull`/`git
      # clone` - it has to be created directly on each host (this AWS
      # server included) from .env.example, with a real
      # POSTGRES_PASSWORD value, before this will start at all.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env - copy .env.example on this host and fill it in}
      POSTGRES_DB: safebill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safebill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      # Same ${POSTGRES_PASSWORD:?...} as the db service above, not a bare
      # reference - this must resolve to the exact same value db was
      # actually initialized with, or asyncpg fails with
      # InvalidPasswordError; failing loudly here if .env is missing beats
      # silently trying to connect with an empty password.
      DATABASE_URL: postgresql+asyncpg://safebill:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env - copy .env.example on this host and fill it in}@db:5432/safebill
      REDIS_URL: redis://redis:6379/0
      VISION_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VLM_TIMEOUT_SECONDS: 60
    ports:
      - "8000:8000"
    volumes:
      - ./:/app # to change code without rebuilding the image
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    # No `volumes:` mount on this service (unlike api above) - env_file
    # is the ONLY way this container ever sees .env at all, which is
    # exactly why it was crashing at startup with a pydantic
    # ValidationError on secret_key/internal_api_key: neither has a
    # default in app/config.py's Settings, and with no volume mount and
    # no env_file, there was nothing in this container's environment or
    # filesystem for pydantic-settings to find them in.
    env_file:
      - .env
    environment:
      # Same ${POSTGRES_PASSWORD:?...} as the db service above, not a bare
      # reference - this must resolve to the exact same value db was
      # actually initialized with, or asyncpg fails with
      # InvalidPasswordError; failing loudly here if .env is missing beats
      # silently trying to connect with an empty password.
      DATABASE_URL: postgresql+asyncpg://safebill:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env - copy .env.example on this host and fill it in}@db:5432/safebill
      REDIS_URL: redis://redis:6379/0
      VISION_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Only the worker (Enforcer + Analyst) sends Telegram alerts - the
      # api process never needs this. Set in a .env file next to this
      # compose file, or export in the shell before `docker compose up`.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    # Own Dockerfile, not `build: .` (the default ./Dockerfile api/worker
    # use) - see Dockerfile.bot's own comment for why: telegram_bot.py has
    # a separate requirements-bot.txt (pyTelegramBotAPI/requests, neither
    # of which is in requirements.txt) and isn't even copied into the main
    # image at all (that Dockerfile only COPYs app/). context: . still
    # means this builds from the current directory, exactly as asked -
    # only the Dockerfile actually used within that context differs.
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      # Overrides BACKEND_URL's own http://localhost:8000 default (see
      # telegram_bot.py) - inside Docker's network "localhost" would mean
      # this container itself, which has no API server of its own
      # listening on port 8000; api is reachable by its service name.
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    # No `volumes:` mount (unlike api's own ./:/app) - telegram_bot.py has
    # no --reload-style hot-reloading of its own (it's a plain polling
    # script, not uvicorn), so a live-mounted source file wouldn't restart
    # anything on a change anyway; same reasoning already applies to
    # worker above, which also has no such mount.

volumes:
  pgdata:
